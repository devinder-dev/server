defaults
    mode http
    timeout connect 5s
    timeout client 24h
    timeout server 24h

frontend docker_discovery
    bind :2375
    acl read_method method GET HEAD
    acl discovery_path path_reg ^(/v[0-9]+[.][0-9]+)?/(_ping|version|events|containers/json|containers/[a-f0-9]{64}/json)$
    http-request deny unless read_method discovery_path
    default_backend docker_engine

backend docker_engine
    server engine /var/run/docker.sock
